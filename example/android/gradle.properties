org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# This connection is slow (~40KB/s to dl.google.com as measured), so
# Gradle's default HTTP timeouts kill in-progress downloads of large
# artifacts (like the Android Gradle Plugin jar) before they finish.
# Generous timeouts here let a slow-but-working download complete
# instead of failing and forcing a retry from scratch.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
