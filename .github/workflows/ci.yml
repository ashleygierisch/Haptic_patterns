name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --no-fatal-infos
        working-directory: example
      - run: flutter test
        working-directory: example

  android-native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: ./gradlew :haptic_patterns:testDebugUnitTest --console=plain
        working-directory: example/android

  ios-native-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - name: Generate iOS build config (creates Podfile if missing)
        run: flutter build ios --config-only --no-codesign
        working-directory: example
      - run: pod install
        working-directory: example/ios
      - name: Run XCTest suite on iOS Simulator
        working-directory: example/ios
        run: |
          # Picking a specific iPhone model by name goes stale as Apple
          # ships new hardware and GitHub updates the Xcode image (hit
          # exactly this with a hardcoded "iPhone 15" already) -- so
          # instead pick whatever iOS Simulator iPhone is actually
          # available on this runner at the time it runs.
          DEVICE_NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries[]
            | select(.key | test("iOS"))
            | .value[]
            | select(.name | test("^iPhone"))
            | .name
          ' | head -1)
          echo "Using simulator: $DEVICE_NAME"
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -only-testing:RunnerTests
